<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    p{
      font-size: 3rem;
      text-align: center;
      font-weight: bold;
    }

    .flag{
      background-color: #CF1025;
      width: 900px;
      height: 600px;
      margin: 0 auto;
    }

    .flag>p{
      color: white;
    }

    .flag > div{
      background-color: #052868;
      height: 300px;
      position: relative;
      top: 50px;
    }

    .flag>div div {
      background-color: white;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      position: relative;
      top: 50px;
      left: 350px;
    }

    .flag>div p{
      position: absolute;
      top: 25px;
      left: 25px;
    }
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
