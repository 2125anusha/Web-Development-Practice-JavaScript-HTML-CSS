<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <h1>New Year Shopping List</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="amazon" />
            <label for="amazon">Buy Dress in Amazon</label>
            <ul class="sub-item">
                <li><a href="https://www.amazon.com/" target="_blank" class="sub-item-link">Product Details</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="swiggy" />
            <label for="swiggy">Order Lunch at KFC</label>
            <ul class="sub-item">
                <li><a href="https://www.kfc.com/" target="_blank" class="sub-item-link">KFC Special Menu</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="pvr" />
            <label for="pvr">Book a Movie ticket at PVR</label>
            <ul class="sub-item">
                <li><a href="https://www.pvrcinemas.com/" target="_blank" class="sub-item-link">Movie Booking Page</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="instagram" />
            <label for="instagram">Send New Year Wishes to Friend in Instagram</label>
            <ul class="sub-item">
                <li><a href="https://www.instagram.com/" target="_blank" class="sub-item-link">Instagram Profile</a></li>
            </ul>
        </li>
    </ul>
</body>

</html>
